services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: ${WEB_PORT:-3000}
    ports:
      - '${WEB_PORT:-3000}:${WEB_PORT:-3000}'
    networks:
      - clientflow-network
    init: true
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.WEB_PORT).then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-clientflow}:${POSTGRES_PASSWORD:-clientflow}@postgres:5432/${POSTGRES_DB:-clientflow}}
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '${API_PORT:-4000}:${API_PORT:-4000}'
    networks:
      - clientflow-network
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.API_PORT + '/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientflow}
      POSTGRES_USER: ${POSTGRES_USER:-clientflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - clientflow-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: clientflow-postgres-data

networks:
  clientflow-network:
    name: clientflow-network
    driver: bridge
